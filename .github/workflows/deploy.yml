name: Deploy

on:
  push:
    branches:
      - develop
      - staging
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true
        
    - name: Install Poetry Export Plugin
      run: |
        poetry self add poetry-plugin-export
    
    - name: Load cached venv
      id: cached-poetry-dependencies
      uses: actions/cache@v4
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}
    
    - name: Install dependencies
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
      run: poetry install --no-interaction --no-root
    
    - name: Run tests
      env:
        DATABASE_URL: "mysql+pymysql://test:test@localhost:3306/test"
        ASAAS_API_KEY: test_key
        ASAAS_API_URL: https://sandbox.asaas.com/api/v3
        ASAAS_WEBHOOK_TOKEN: test_token
      run: |
        poetry run pytest tests/ -v --cov=src --cov-report=term-missing || true

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'develop' && 'development' || github.ref_name == 'staging' && 'staging' || 'production' }}
    
    steps:
    - uses: actions/checkout@v4

    - name: Set environment
      id: set-env
      run: |
        if [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
          echo "stage=dev" >> $GITHUB_OUTPUT
        elif [[ "${{ github.ref }}" == "refs/heads/staging" ]]; then
          echo "stage=stg" >> $GITHUB_OUTPUT
        elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          echo "stage=prod" >> $GITHUB_OUTPUT
        fi

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true
        
    - name: Install Poetry Export Plugin
      run: |
        poetry self add poetry-plugin-export

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: |
        npm ci
        npm install -g serverless@3
        poetry export -f requirements.txt --output requirements.txt --without-hashes

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

    - name: Update serverless.yml for Linux deployment
      run: |
        # Enable dockerizePip for proper Lambda compilation
        sed -i 's/dockerizePip: false/dockerizePip: true/' serverless.yml

    - name: Create or Update Custom Domain
      run: |
        echo "Setting up custom domain..."
        npx serverless create_domain --stage ${{ steps.set-env.outputs.stage }} || echo "Domain might already exist, continuing..."
      continue-on-error: true

    - name: Deploy Application
      run: |
        # Fix DATABASE_URL format for Python SQLAlchemy
        FIXED_DB_URL=$(echo "${{ vars.DATABASE_URL }}" | sed 's|mysql://|mysql+pymysql://|')
        export DATABASE_URL="$FIXED_DB_URL"
        
        serverless deploy --stage ${{ steps.set-env.outputs.stage }} --verbose
      env:
        ASAAS_API_KEY: ${{ secrets.ASAAS_API_KEY || vars.ASAAS_API_KEY }}
        ASAAS_WEBHOOK_TOKEN: ${{ vars.ASAAS_WEBHOOK_TOKEN }}
        ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
        ADMIN_PASSWORD: ${{ vars.ADMIN_PASSWORD }}

    - name: Get deployment info
      id: deployment-info
      run: |
        ENDPOINT=$(serverless info --stage ${{ steps.set-env.outputs.stage }} --verbose | grep "endpoint:" | sed 's/.*endpoint: //')
        echo "endpoint=$ENDPOINT" >> $GITHUB_OUTPUT
        echo "Deployed to: $ENDPOINT"

    - name: Run smoke test
      run: |
        ENDPOINT="${{ steps.deployment-info.outputs.endpoint }}"
        echo "Testing health endpoint at: $ENDPOINT/health"
        
        # Wait a bit for Lambda to be ready
        sleep 10
        
        # Test health endpoint
        HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$ENDPOINT/health")
        echo "Health check returned HTTP code: $HTTP_CODE"
        
        if [ "$HTTP_CODE" -eq 200 ]; then
          echo "Health check passed!"
        else
          echo "Health check failed!"
          curl -v "$ENDPOINT/health"
          exit 1
        fi
      continue-on-error: true

    - name: Display and Test Custom Domain
      run: |
        STAGE=${{ steps.set-env.outputs.stage }}
        if [ "$STAGE" == "dev" ]; then
          CUSTOM_DOMAIN="https://billing-dev.numbr.com.br"
        elif [ "$STAGE" == "stg" ]; then
          CUSTOM_DOMAIN="https://billing-staging.numbr.com.br"
        elif [ "$STAGE" == "prod" ]; then
          CUSTOM_DOMAIN="https://billing.numbr.com.br"
        fi
        
        echo "🌐 Custom domain: $CUSTOM_DOMAIN"
        echo "Waiting for domain propagation..."
        sleep 30
        
        echo "Testing custom domain health endpoint..."
        HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$CUSTOM_DOMAIN/health" || echo "000")
        
        if [ "$HTTP_CODE" -eq 200 ]; then
          echo "✅ Custom domain is working!"
        else
          echo "⚠️  Custom domain not responding yet (HTTP $HTTP_CODE)"
          echo "This is normal for first deployment. Domain may take up to 40 minutes to propagate."
        fi