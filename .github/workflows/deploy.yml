name: Deploy

on:
  push:
    branches:
      - develop
      - staging
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'develop' && 'development' || github.ref_name == 'staging' && 'staging' || 'production' }}
    
    steps:
    - uses: actions/checkout@v4

    - name: Set environment name
      id: set-env
      run: |
        if [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
          echo "env_name=dev" >> $GITHUB_OUTPUT
          echo "stack_name=numbr-billing-dev" >> $GITHUB_OUTPUT
          echo "domain_name=billing-dev.numbr.com.br" >> $GITHUB_OUTPUT
        elif [[ "${{ github.ref }}" == "refs/heads/staging" ]]; then
          echo "env_name=stg" >> $GITHUB_OUTPUT
          echo "stack_name=numbr-billing-stg" >> $GITHUB_OUTPUT
          echo "domain_name=billing-staging.numbr.com.br" >> $GITHUB_OUTPUT
        elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          echo "env_name=prod" >> $GITHUB_OUTPUT
          echo "stack_name=numbr-billing-prod" >> $GITHUB_OUTPUT
          echo "domain_name=billing.numbr.com.br" >> $GITHUB_OUTPUT
        fi

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build application
      run: |
        npm run prisma:generate
        npm run build

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Get AWS Account Info
      id: aws-account
      run: |
        ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
        echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
        echo "region=${{ secrets.AWS_REGION }}" >> $GITHUB_OUTPUT

    - name: Build Lambda package
      run: |
        chmod +x scripts/build-lambda.sh
        ./scripts/build-lambda.sh ${{ steps.set-env.outputs.env_name }}

    - name: Create deployment bucket
      run: |
        BUCKET_NAME="numbr-billing-deployment-${{ steps.aws-account.outputs.account_id }}-${{ steps.aws-account.outputs.region }}"
        echo "Checking/creating bucket: $BUCKET_NAME"
        aws s3api head-bucket --bucket $BUCKET_NAME 2>/dev/null || \
        aws s3 mb s3://$BUCKET_NAME || true

    - name: Upload Lambda package to S3
      run: |
        echo "Checking for Lambda packages..."
        ls -la *.zip || echo "No zip files found"
        
        BUCKET_NAME="numbr-billing-deployment-${{ steps.aws-account.outputs.account_id }}-${{ steps.aws-account.outputs.region }}"
        TIMESTAMP=$(date +%Y%m%d%H%M%S)
        
        if [ ! -f lambda-package.zip ]; then
          echo "ERROR: lambda-package.zip not found!"
          exit 1
        fi
        
        echo "Uploading lambda-package.zip to s3://$BUCKET_NAME/lambda-${{ steps.set-env.outputs.env_name }}-$TIMESTAMP.zip"
        aws s3 cp lambda-package.zip s3://$BUCKET_NAME/lambda-${{ steps.set-env.outputs.env_name }}-$TIMESTAMP.zip
        echo "LAMBDA_S3_KEY=lambda-${{ steps.set-env.outputs.env_name }}-$TIMESTAMP.zip" >> $GITHUB_ENV
        
        if [ -f layer-package.zip ]; then
          echo "Uploading layer-package.zip to s3://$BUCKET_NAME/layer-${{ steps.set-env.outputs.env_name }}-$TIMESTAMP.zip"
          aws s3 cp layer-package.zip s3://$BUCKET_NAME/layer-${{ steps.set-env.outputs.env_name }}-$TIMESTAMP.zip
          echo "LAYER_S3_KEY=layer-${{ steps.set-env.outputs.env_name }}-$TIMESTAMP.zip" >> $GITHUB_ENV
        fi

    - name: Deploy CloudFormation stack
      run: |
        echo "Deploying stack: ${{ steps.set-env.outputs.stack_name }}"
        echo "Environment: ${{ steps.set-env.outputs.env_name }}"
        
        BUCKET_NAME="numbr-billing-deployment-${{ steps.aws-account.outputs.account_id }}-${{ steps.aws-account.outputs.region }}"
        
        # Update template with S3 locations
        sed -i "s|CodeUri: ../|CodeUri: s3://$BUCKET_NAME/$LAMBDA_S3_KEY|g" cloudformation/template.yaml
        sed -i "s|ContentUri: ../layer/|ContentUri: s3://$BUCKET_NAME/$LAYER_S3_KEY|g" cloudformation/template.yaml
        
        aws cloudformation deploy \
          --template-file cloudformation/template.yaml \
          --stack-name ${{ steps.set-env.outputs.stack_name }} \
          --s3-bucket $BUCKET_NAME \
          --parameter-overrides \
            Environment=${{ steps.set-env.outputs.env_name }} \
            DatabaseUrl="${{ vars.DATABASE_URL }}" \
            AsaasApiKey="${{ vars.ASAAS_API_KEY }}" \
            AsaasWebhookToken="${{ vars.ASAAS_WEBHOOK_TOKEN }}" \
            AdminEmail="${{ vars.ADMIN_EMAIL }}" \
            AdminPassword="${{ vars.ADMIN_PASSWORD }}" \
          --capabilities CAPABILITY_IAM CAPABILITY_AUTO_EXPAND \
          --no-fail-on-empty-changeset

    - name: Update Lambda function code
      run: |
        aws lambda update-function-code \
          --function-name numbr-billing-${{ steps.set-env.outputs.env_name }}-function \
          --zip-file fileb://lambda-package.zip

    - name: Wait for Lambda update
      run: |
        aws lambda wait function-updated \
          --function-name numbr-billing-${{ steps.set-env.outputs.env_name }}-function

    - name: Update Lambda Layer
      if: hashFiles('layer-package.zip') != ''
      run: |
        LAYER_VERSION=$(aws lambda publish-layer-version \
          --layer-name numbr-billing-${{ steps.set-env.outputs.env_name }}-deps \
          --zip-file fileb://layer-package.zip \
          --compatible-runtimes nodejs20.x \
          --query 'Version' \
          --output text)
        
        aws lambda update-function-configuration \
          --function-name numbr-billing-${{ steps.set-env.outputs.env_name }}-function \
          --layers arn:aws:lambda:${{ secrets.AWS_REGION }}:${{ secrets.AWS_ACCOUNT_ID }}:layer:numbr-billing-${{ steps.set-env.outputs.env_name }}-deps:$LAYER_VERSION

    - name: Get API Gateway URL
      id: get-api-url
      run: |
        API_URL=$(aws cloudformation describe-stacks \
          --stack-name ${{ steps.set-env.outputs.stack_name }} \
          --query 'Stacks[0].Outputs[?OutputKey==`ApiUrl`].OutputValue' \
          --output text)
        echo "api_url=$API_URL" >> $GITHUB_OUTPUT

    - name: Smoke test
      run: |
        echo "Testing API at: ${{ steps.get-api-url.outputs.api_url }}"
        curl -f ${{ steps.get-api-url.outputs.api_url }}/health || exit 1

    - name: Notify deployment
      if: always()
      run: |
        echo "Deployment completed for ${{ steps.set-env.outputs.env_name }} environment"
        echo "API URL: ${{ steps.get-api-url.outputs.api_url }}"