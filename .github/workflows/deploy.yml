name: Deploy to AWS Lambda with Zappa

on:
  push:
    branches:
      - develop
      - staging
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true
    
    - name: Load cached venv
      id: cached-poetry-dependencies
      uses: actions/cache@v4
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}
    
    - name: Install dependencies
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
      run: poetry install --no-interaction --no-root --without dev
    
    - name: Install Zappa
      run: poetry add zappa
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1
    
    - name: Set environment variables
      run: |
        if [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
          STAGE="dev"
          DB_URL="${{ vars.DATABASE_URL_DEV }}"
          ASAAS_KEY="${{ secrets.ASAAS_API_KEY_DEV }}"
        elif [[ "${{ github.ref }}" == "refs/heads/staging" ]]; then
          STAGE="staging"
          DB_URL="${{ vars.DATABASE_URL_STAGING }}"
          ASAAS_KEY="${{ secrets.ASAAS_API_KEY_STAGING }}"
        elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          STAGE="prod"
          DB_URL="${{ vars.DATABASE_URL_PROD }}"
          ASAAS_KEY="${{ secrets.ASAAS_API_KEY_PROD }}"
        fi
        
        echo "STAGE=$STAGE" >> $GITHUB_ENV
        
        # Convert mysql:// to mysql+pymysql:// for SQLAlchemy
        DB_URL_CONVERTED=$(echo "$DB_URL" | sed 's|mysql://|mysql+pymysql://|')
        
        # Update Zappa settings with environment variables
        poetry run zappa update $STAGE \
          -s DATABASE_URL="$DB_URL_CONVERTED" \
          -s ASAAS_API_KEY="$ASAAS_KEY" \
          -s ASAAS_API_URL="${{ vars.ASAAS_API_URL }}" \
          -s ASAAS_WEBHOOK_TOKEN="${{ secrets.ASAAS_WEBHOOK_TOKEN }}" \
          -s JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}"
    
    - name: Run database migrations
      run: |
        export DATABASE_URL=$(echo "${{ vars.DATABASE_URL_DEV }}" | sed 's|mysql://|mysql+pymysql://|')
        poetry run alembic upgrade head
    
    - name: Deploy with Zappa
      run: |
        # Check if deployment exists
        if poetry run zappa status ${{ env.STAGE }} 2>&1 | grep -q "not deployed"; then
          poetry run zappa deploy ${{ env.STAGE }}
        else
          poetry run zappa update ${{ env.STAGE }}
        fi
    
    - name: Get deployment info
      run: poetry run zappa status ${{ env.STAGE }}