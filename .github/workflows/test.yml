name: Test

on:
  push:
    branches: [ develop, staging, main ]
  pull_request:
    branches: [ develop, staging, main ]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Setup test environment
      run: |
        echo "Setting up test environment..."
        # Debug: Check if secret is accessible
        if [ -z "${{ secrets.TEST_DATABASE_URL }}" ]; then
          echo "WARNING: TEST_DATABASE_URL appears to be empty in GitHub secrets"
          echo "Using hardcoded test database URL"
          echo "DATABASE_URL=mysql://numbr_billing_test:TestDB2024@wink-app.cuiqag6yzukq.us-east-1.rds.amazonaws.com:3306/numbr_billing_test" > .env
        else
          echo "DATABASE_URL=${{ secrets.TEST_DATABASE_URL }}" > .env
        fi
        echo "ASAAS_API_KEY=test_api_key" >> .env
        echo "ASAAS_API_URL=https://sandbox.asaas.com/api/v3" >> .env
        echo "ASAAS_WEBHOOK_TOKEN=test_webhook_token" >> .env
        echo "PORT=3001" >> .env
        echo "ADMIN_EMAIL=test@numbr.com" >> .env
        echo "ADMIN_PASSWORD=test123" >> .env
        echo "Contents of .env:"
        cat .env | sed 's/mysql:\/\/[^@]*@/mysql:\/\/***@/g'
        
    - name: Debug environment
      run: |
        echo "Checking if DATABASE_URL is set in environment..."
        if [ -z "$DATABASE_URL" ]; then
          echo "DATABASE_URL is empty in environment"
        else
          echo "DATABASE_URL is set in environment (hidden for security)"
        fi
        echo "Checking .env file..."
        if [ -f .env ]; then
          echo ".env file exists"
          echo "First line of .env (should be DATABASE_URL):"
          head -n1 .env | sed 's/mysql:\/\/[^@]*@/mysql:\/\/***@/g'
        else
          echo ".env file does not exist"
        fi
      env:
        DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        
    - name: Run Prisma migrations
      run: |
        echo "Running Prisma migrations..."
        # If secret is empty, use hardcoded URL
        if [ -z "${{ secrets.TEST_DATABASE_URL }}" ]; then
          export DATABASE_URL="mysql://numbr_billing_test:TestDB2024@wink-app.cuiqag6yzukq.us-east-1.rds.amazonaws.com:3306/numbr_billing_test"
        else
          export DATABASE_URL="${{ secrets.TEST_DATABASE_URL }}"
        fi
        npm run prisma:migrate:test

    - name: Run linter
      run: npm run lint

    - name: Run tests with coverage
      run: npm run test:coverage
      env:
        DATABASE_URL: mysql://numbr_billing_test:TestDB2024@wink-app.cuiqag6yzukq.us-east-1.rds.amazonaws.com:3306/numbr_billing_test
        ASAAS_API_KEY: test_api_key
        ASAAS_API_URL: https://sandbox.asaas.com/api/v3
        ASAAS_WEBHOOK_TOKEN: test_webhook_token
        ADMIN_EMAIL: test@test.com
        ADMIN_PASSWORD: test123

    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report
        path: coverage/