name: Test

on:
  push:
    branches: [ develop, staging, main ]
  pull_request:
    branches: [ develop, staging, main ]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: numbr_billing_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Setup test environment
      run: |
        cp .env.test .env
        echo "DATABASE_URL=mysql://root:test@127.0.0.1:3306/numbr_billing_test" >> .env
        
    - name: Run Prisma migrations
      run: npm run prisma:migrate:test

    - name: Run linter
      run: npm run lint

    - name: Run tests with coverage
      run: npm run test:coverage
      env:
        DATABASE_URL: mysql://root:test@127.0.0.1:3306/numbr_billing_test
        ASAAS_API_KEY: test_api_key
        ASAAS_API_URL: https://sandbox.asaas.com/api/v3
        ASAAS_WEBHOOK_TOKEN: test_webhook_token
        ADMIN_EMAIL: test@test.com
        ADMIN_PASSWORD: test123

    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report
        path: coverage/