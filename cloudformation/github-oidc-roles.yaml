AWSTemplateFormatVersion: '2010-09-09'
Description: GitHub OIDC Provider and Roles for Numbr Billing

Parameters:
  GitHubOrg:
    Type: String
    Default: numbr-com-br
  GitHubRepo:
    Type: String
    Default: numbr_billing

Resources:
  # GitHub OIDC Provider (create only once per account)
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  # Role for Development Environment
  GitHubActionsRoleDev:
    Type: AWS::IAM::Role
    Properties:
      RoleName: github-actions-numbr-billing-dev
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOIDCProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'token.actions.githubusercontent.com:aud': sts.amazonaws.com
              StringLike:
                'token.actions.githubusercontent.com:sub': !Sub 'repo:${GitHubOrg}/${GitHubRepo}:environment:development'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSCloudFormationFullAccess
        - arn:aws:iam::aws:policy/AWSLambda_FullAccess
        - arn:aws:iam::aws:policy/IAMFullAccess
        - arn:aws:iam::aws:policy/AmazonAPIGatewayAdministrator
        - arn:aws:iam::aws:policy/CloudWatchLogsFullAccess

  # Role for Staging Environment
  GitHubActionsRoleStg:
    Type: AWS::IAM::Role
    Properties:
      RoleName: github-actions-numbr-billing-stg
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOIDCProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'token.actions.githubusercontent.com:aud': sts.amazonaws.com
              StringLike:
                'token.actions.githubusercontent.com:sub': !Sub 'repo:${GitHubOrg}/${GitHubRepo}:environment:staging'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSCloudFormationFullAccess
        - arn:aws:iam::aws:policy/AWSLambda_FullAccess
        - arn:aws:iam::aws:policy/IAMFullAccess
        - arn:aws:iam::aws:policy/AmazonAPIGatewayAdministrator
        - arn:aws:iam::aws:policy/CloudWatchLogsFullAccess

  # Role for Production Environment
  GitHubActionsRoleProd:
    Type: AWS::IAM::Role
    Properties:
      RoleName: github-actions-numbr-billing-prod
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOIDCProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'token.actions.githubusercontent.com:aud': sts.amazonaws.com
              StringLike:
                'token.actions.githubusercontent.com:sub': !Sub 'repo:${GitHubOrg}/${GitHubRepo}:environment:production'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSCloudFormationFullAccess
        - arn:aws:iam::aws:policy/AWSLambda_FullAccess
        - arn:aws:iam::aws:policy/IAMFullAccess
        - arn:aws:iam::aws:policy/AmazonAPIGatewayAdministrator
        - arn:aws:iam::aws:policy/CloudWatchLogsFullAccess

Outputs:
  DevRoleArn:
    Value: !GetAtt GitHubActionsRoleDev.Arn
    Description: ARN for Development GitHub Actions Role
  
  StgRoleArn:
    Value: !GetAtt GitHubActionsRoleStg.Arn
    Description: ARN for Staging GitHub Actions Role
  
  ProdRoleArn:
    Value: !GetAtt GitHubActionsRoleProd.Arn
    Description: ARN for Production GitHub Actions Role