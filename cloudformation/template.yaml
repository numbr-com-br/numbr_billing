AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Numbr Billing - SaaS Billing System

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, stg, prod]
    Description: Environment name
  
  DatabaseUrl:
    Type: String
    NoEcho: true
    Description: MySQL database connection URL
  
  AsaasApiKey:
    Type: String
    NoEcho: true
    Description: Asaas API key
  
  AsaasWebhookToken:
    Type: String
    NoEcho: true
    Description: Asaas webhook validation token
  
  AdminEmail:
    Type: String
    NoEcho: true
    Description: Admin panel email
  
  AdminPassword:
    Type: String
    NoEcho: true
    Description: Admin panel password
  
  DomainName:
    Type: String
    Description: Custom domain name
    Default: ''

Globals:
  Function:
    Timeout: 30
    MemorySize: 1024
    Runtime: nodejs20.x
    Environment:
      Variables:
        NODE_ENV: production
        AWS_NODEJS_CONNECTION_REUSE_ENABLED: 1

Resources:
  # API Gateway
  Api:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub numbr-billing-${Environment}-api
      StageName: !Ref Environment
      Cors:
        AllowMethods: "'*'"
        AllowHeaders: "'*'"
        AllowOrigin: "'*'"
      BinaryMediaTypes:
        - '*/*'

  # Lambda Function
  BillingFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub numbr-billing-${Environment}-function
      CodeUri: ../
      Handler: dist/lambda.handler
      Layers:
        - !Ref DependenciesLayer
      Environment:
        Variables:
          DATABASE_URL: !Ref DatabaseUrl
          ASAAS_API_KEY: !Ref AsaasApiKey
          ASAAS_API_URL: !If 
            - IsProd
            - https://api.asaas.com/v3
            - https://sandbox.asaas.com/api/v3
          ASAAS_WEBHOOK_TOKEN: !Ref AsaasWebhookToken
          ADMIN_EMAIL: !Ref AdminEmail
          ADMIN_PASSWORD: !Ref AdminPassword
          PORT: 3000
          IS_LAMBDA: true
      Events:
        ProxyApiRoot:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /
            Method: ANY
        ProxyApiGreedy:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /{proxy+}
            Method: ANY
      Policies:
        - VPCAccessPolicy: {}
        - Statement:
          - Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:numbr-billing/${Environment}/*
          - Effect: Allow
            Action:
              - rds:DescribeDBInstances
              - rds:DescribeDBClusters
            Resource: '*'

  # Lambda Layer for Dependencies
  DependenciesLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub numbr-billing-${Environment}-deps
      ContentUri: ../layer/
      CompatibleRuntimes:
        - nodejs20.x
      RetentionPolicy: Delete

  # CloudWatch Log Group
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/numbr-billing-${Environment}-function
      RetentionInDays: !If [IsProd, 30, 7]

  # Lambda Function URL (for direct access if needed)
  FunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      AuthType: NONE
      TargetFunctionArn: !GetAtt BillingFunction.Arn
      Cors:
        AllowOrigins:
          - '*'
        AllowMethods:
          - '*'
        AllowHeaders:
          - '*'

  # Permission for Function URL
  FunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref BillingFunction
      Principal: '*'
      Action: lambda:InvokeFunctionUrl
      FunctionUrlAuthType: NONE

  # Custom Domain (only if domain name is provided)
  DomainCertificate:
    Type: AWS::CertificateManager::Certificate
    Condition: HasDomainName
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: Z08904861PTUJ33P2141S

  CustomDomain:
    Type: AWS::ApiGateway::DomainName
    Condition: HasDomainName
    Properties:
      DomainName: !Ref DomainName
      RegionalCertificateArn: !Ref DomainCertificate
      EndpointConfiguration:
        Types:
          - REGIONAL

  BasePathMapping:
    Type: AWS::ApiGateway::BasePathMapping
    Condition: HasDomainName
    Properties:
      DomainName: !Ref CustomDomain
      RestApiId: !Ref Api
      Stage: !Ref Environment

Conditions:
  IsProd: !Equals [!Ref Environment, prod]
  HasDomainName: !Not [!Equals [!Ref DomainName, '']]

Outputs:
  ApiUrl:
    Description: API Gateway URL
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
  
  FunctionUrl:
    Description: Lambda Function URL
    Value: !GetAtt FunctionUrl.FunctionUrl
  
  FunctionArn:
    Description: Lambda Function ARN
    Value: !GetAtt BillingFunction.Arn
  
  CustomDomainName:
    Condition: HasDomainName
    Description: Custom domain regional domain name
    Value: !GetAtt CustomDomain.RegionalDomainName
  
  CustomDomainHostedZoneId:
    Condition: HasDomainName
    Description: Custom domain regional hosted zone ID
    Value: !GetAtt CustomDomain.RegionalHostedZoneId