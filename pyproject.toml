[tool.poetry]
name = "numbr-billing"
version = "1.0.0"
description = "SaaS billing system with Asaas integration"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
flask = "^3.1.0"
flask-cors = "^5.0.0"
flask-jwt-extended = "^4.6.0"
sqlalchemy = "^2.0.36"
alembic = "^1.14.0"
pymysql = "^1.1.1"
cryptography = "^44.0.0"
httpx = "^0.28.0"
python-dotenv = "^1.0.1"
pydantic-settings = "^2.10.1"
pydantic = "^2.11.7"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
itsdangerous = "^2.2.0"
email-validator = "^2.2.0"
zappa = "^0.60.2"
marshmallow = "^3.23.1"
flask-admin = "^1.6.1"
wtforms = "^3.2.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
ruff = "^0.8.4"
black = "^24.10.0"
requests = "^2.32.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ['py311']