service: numbr-billing

frameworkVersion: '3'

provider:
  name: aws
  runtime: python3.11
  architecture: x86_64
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-1'}
  profile: ${opt:aws-profile, ''}
  deploymentBucket:
    name: numbr-serverless-deployments-${self:provider.stage}
  memorySize: 1024
  timeout: 30
  environment:
    DATABASE_URL: ${env:DATABASE_URL}
    ASAAS_API_KEY: ${env:ASAAS_API_KEY}
    ASAAS_API_URL: ${self:custom.asaasApiUrl.${self:provider.stage}}
    ASAAS_WEBHOOK_TOKEN: ${env:ASAAS_WEBHOOK_TOKEN}
    JWT_SECRET_KEY: ${env:JWT_SECRET_KEY}
    PORT: 3000
    IS_LAMBDA: true
    ENVIRONMENT: ${self:provider.stage}
  vpc:
    securityGroupIds:
      - sg-07c0789892e7fbb93
      - sg-04339132ab5ce6d1e
    subnetIds:
      - subnet-09d7e681695def448
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - secretsmanager:GetSecretValue
          Resource: arn:aws:secretsmanager:${aws:region}:${aws:accountId}:secret:numbr-billing/${self:provider.stage}/*
        - Effect: Allow
          Action:
            - rds:DescribeDBInstances
            - rds:DescribeDBClusters
          Resource: '*'
        - Effect: Allow
          Action:
            - ec2:CreateNetworkInterface
            - ec2:DescribeNetworkInterfaces
            - ec2:DeleteNetworkInterface
            - ec2:AssignPrivateIpAddresses
            - ec2:UnassignPrivateIpAddresses
          Resource: '*'

custom:
  asaasApiUrl:
    dev: https://sandbox.asaas.com/api/v3
    stg: https://sandbox.asaas.com/api/v3
    prod: https://api.asaas.com/v3
  customDomain:
    domainName: ${self:custom.domains.${self:provider.stage}}
    basePath: ''
    stage: ${self:provider.stage}
    createRoute53Record: true
    certificateName: '*.numbr.com.br'
    endpointType: 'regional'
    apiType: 'rest'
    enabled: true
  domains:
    dev: billing-dev.numbr.com.br
    stg: billing-staging.numbr.com.br
    prod: billing.numbr.com.br
  pythonRequirements:
    dockerizePip: false
    slim: false
    strip: false
    layer: true
    usePoetry: false
    noDeploy:
      - boto3
      - botocore
  serverless-offline:
    httpPort: 3000
    lambdaPort: 3001
    reloadHandler: true

functions:
  api:
    handler: src.lambda.handler
    events:
      - http:
          path: /
          method: ANY
          cors: true
      - http:
          path: /{proxy+}
          method: ANY
          cors: true
    layers:
      - Ref: PythonRequirementsLambdaLayer

plugins:
  - serverless-domain-manager
  - serverless-python-requirements
  - serverless-offline

package:
  individually: false
  patterns:
    - '!.git/**'
    - '!.serverless/**'
    - '!.localfiles/**'
    - '!.venv/**'
    - '!.pytest_cache/**'
    - '!tests/**'
    - '!.env*'
    - '!README.md'
    - '!alembic/**'
    - '!*.db'
    - '!__pycache__/**'
    - '!.ruff_cache/**'